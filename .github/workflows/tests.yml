# Tests à chaque pull request et à chaque push sur main (les tests Docker sont sautés).
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
      - name: Bibliothèques système de gmsh (génération des maillages de test)
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxcursor1 libxinerama1 libxft2
      - name: Frontend
        run: cd frontend && npm ci && npx svelte-check --tsconfig ./tsconfig.json && npm test && npm run build
      - name: Backend
        run: |
          uv venv && uv pip install -e ".[dev]"
          .venv/bin/pytest -q
