# Archive portable Linux construite et jointe à la release quand un tag v* est poussé.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
      - name: Bibliothèques système de gmsh (génération des maillages de test)
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxcursor1 libxinerama1 libxft2
      - name: Tests
        run: |
          uv venv && uv pip install -e ".[dev]"
          (cd frontend && npm ci && npm run build)
          .venv/bin/pytest -q
      - name: Archive portable
        run: scripts/build-portable.sh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
            dist/*.sha256
