[project]
name = "asteroid"
version = "0.3.0"
description = "Préparer, lancer et suivre des calculs Code_Aster sans Salome-Meca"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "h5py>=3.10",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/Lucacas31/asteroid"
Issues = "https://github.com/Lucacas31/asteroid/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "gmsh>=4.12"]

[project.scripts]
asteroid = "asteroid.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asteroid"]
artifacts = ["asteroid/static/**", "asteroid/data/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
